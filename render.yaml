# Render Blueprint: 백엔드를 Docker로 올린다 (무료 인스턴스).
# Render 대시보드 → New → Blueprint → 이 저장소를 고르면 이 파일대로 만들어진다.
services:
  - type: web
    name: undersign-assist-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: GROQ_API_KEY
        sync: false
