name: Backend regression tests

on:
  push:
    paths: ["backend/**", "app/test/fixtures/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", "app/test/fixtures/**", ".github/workflows/backend-tests.yml"]
  workflow_dispatch:
    inputs:
      full_ocr_matrix:
        description: Run all 240 synthetic camera cases
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/tests -p "test_*.py" -v
      - run: python backend/tests/smoke_judge.py
      - name: Install local Korean OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-kor
      - name: Camera regression smoke test
        env:
          OMP_THREAD_LIMIT: "1"
        run: >-
          python backend/tests/stress_ocr_documents.py
          --cases g_labor g_notice g_consent g_application g_summary g_receipt
          --profiles clean shadow sideways upside_down cropped_title
          --output work/camera-ci.json
      - name: Full camera matrix
        if: github.event_name == 'workflow_dispatch' && inputs.full_ocr_matrix
        env:
          OMP_THREAD_LIMIT: "1"
        run: python backend/tests/stress_ocr_documents.py --output work/camera-full.json
      - name: Save OCR diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-evaluation
          path: work/camera-*.json
          if-no-files-found: ignore
