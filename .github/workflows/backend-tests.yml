name: Backend regression tests

on:
  push:
    paths: ["backend/**", "samples/**", "app/test/fixtures/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", "samples/**", "app/test/fixtures/**", ".github/workflows/backend-tests.yml"]
  workflow_dispatch:
    inputs:
      full_ocr_matrix:
        description: Run the camera matrix and extended scene evaluation
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # frozen pre-expansion classifier for identical-OCR comparison
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s backend/tests -p "test_*.py" -v
      - run: python backend/tests/smoke_judge.py
      - name: Build and smoke test the deployment container
        run: |
          docker build --tag undersign-assist-ci backend
          trap 'status=$?; if [ "$status" -ne 0 ]; then docker logs undersign-assist-ci; fi; docker rm -f undersign-assist-ci >/dev/null; exit "$status"' EXIT
          docker run --detach --name undersign-assist-ci \
            --publish 127.0.0.1:18000:7860 --env GROQ_API_KEY= undersign-assist-ci
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 1 --max-time 10 http://127.0.0.1:18000/api/health
          docker exec undersign-assist-ci python -c "import pytesseract; assert 'kor' in pytesseract.get_languages(config='')"
          mkdir -p work
          curl --fail --silent --show-error --max-time 120 \
            --form photo=@samples/boundaries/images/inline_certificate/clean-1.jpg \
            http://127.0.0.1:18000/api/read > work/container-read.json
          python -c "import json; d=json.load(open('work/container-read.json')); assert d['doc_type']=='certificate'; assert d['blocks']; assert len(d['pages'])==1; assert d['reference_pages']==[]"
      - name: Install local Korean OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-kor
      - name: Camera regression smoke test
        env:
          OMP_THREAD_LIMIT: "1"
        run: >-
          python backend/tests/stress_ocr_documents.py
          --cases g_labor g_loan g_notice g_consent g_application g_summary g_receipt
          --profiles clean shadow sideways upside_down cropped_title
          --output work/camera-ci.json
      - name: Full camera matrix
        if: github.event_name == 'workflow_dispatch' && inputs.full_ocr_matrix
        env:
          OMP_THREAD_LIMIT: "1"
        run: python backend/tests/stress_ocr_documents.py --output work/camera-full.json
      - name: Difficult scene and partial reading regression
        env:
          OMP_THREAD_LIMIT: "1"
        run: >-
          python backend/tests/realistic_ocr_documents.py
          --profiles tilted desk grid dark_screen screen_moire body_blurred
          --require-correct --output work/camera-scenes.json
      - name: Extended scene evaluation
        if: github.event_name == 'workflow_dispatch' && inputs.full_ocr_matrix
        env:
          OMP_THREAD_LIMIT: "1"
        run: |
          python backend/tests/realistic_ocr_documents.py --suite holdout --output work/camera-holdout.json
          python backend/tests/realistic_ocr_documents.py --suite samples --output work/camera-samples.json
      - name: Saved blank form regression
        run: >-
          python backend/tests/sample_corpus.py evaluate
          --suites originals --cases 작품요약서.png
          --profiles clean desk tilted dark_screen --require-correct
          --output work/camera-saved-form.json
      - name: Saved everyday scenes and unreadable negatives
        run: >-
          python backend/tests/sample_corpus.py evaluate
          --suites everyday_text
          --cases g_labor g_loan g_notice g_consent g_application g_summary g_receipt
          --profiles distant_desk sideways_desk body_glare tiny_unreadable --require-correct
          --output work/camera-saved-scenes.json
      - name: Original photo coordinates after crop and rotation
        run: python backend/tests/check_sample_geometry.py work/camera-saved-scenes.json
      - name: Saved expanded document types with real OCR
        env:
          OMP_THREAD_LIMIT: "1"
        run: |
          python backend/tests/expanded_document_samples.py ocr --profiles clean cropped_title tiny_unreadable --cache work/camera-expanded-ocr.json
          python backend/tests/expanded_document_samples.py evaluate --profiles clean cropped_title tiny_unreadable --cache work/camera-expanded-ocr.json --output work/camera-expanded-result.json --require-correct
      - name: Save OCR diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-evaluation
          path: work/camera-*.json
          if-no-files-found: ignore
      - name: Measure new boundary scenes including remaining OCR limitations
        env:
          OMP_THREAD_LIMIT: "1"
        run: |
          python backend/tests/boundary_ocr_samples.py ocr --cache work/boundary-ocr.json
          python backend/tests/boundary_ocr_samples.py evaluate --cache work/boundary-ocr.json --output work/boundary-result.json
      - name: Save boundary OCR measurements including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-evaluation
          path: work/boundary-*.json
          if-no-files-found: ignore
      - name: Mixed pages and identity ownership with saved real OCR inputs
        env:
          OMP_THREAD_LIMIT: "1"
        run: python backend/tests/review_round2_samples.py evaluate --require-correct --output work/review-round2-result.json
      - name: Save mixed-page OCR diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-round2-evaluation
          path: work/review-round2-result.json
          if-no-files-found: ignore
