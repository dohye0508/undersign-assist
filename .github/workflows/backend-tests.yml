name: Backend regression tests

on:
  push:
    paths: ["backend/**", "samples/**", "app/test/fixtures/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", "samples/**", "app/test/fixtures/**", ".github/workflows/backend-tests.yml"]
  workflow_dispatch:
    inputs:
      full_ocr_matrix:
        description: Run the camera matrix and extended scene evaluation
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/tests -p "test_*.py" -v
      - run: python backend/tests/smoke_judge.py
      - name: Install local Korean OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-kor
      - name: Camera regression smoke test
        env:
          OMP_THREAD_LIMIT: "1"
        run: >-
          python backend/tests/stress_ocr_documents.py
          --cases g_labor g_loan g_notice g_consent g_application g_summary g_receipt
          --profiles clean shadow sideways upside_down cropped_title
          --output work/camera-ci.json
      - name: Full camera matrix
        if: github.event_name == 'workflow_dispatch' && inputs.full_ocr_matrix
        env:
          OMP_THREAD_LIMIT: "1"
        run: python backend/tests/stress_ocr_documents.py --output work/camera-full.json
      - name: Difficult scene and partial reading regression
        env:
          OMP_THREAD_LIMIT: "1"
        run: >-
          python backend/tests/realistic_ocr_documents.py
          --profiles tilted desk grid dark_screen screen_moire body_blurred
          --require-correct --output work/camera-scenes.json
      - name: Extended scene evaluation
        if: github.event_name == 'workflow_dispatch' && inputs.full_ocr_matrix
        env:
          OMP_THREAD_LIMIT: "1"
        run: |
          python backend/tests/realistic_ocr_documents.py --suite holdout --output work/camera-holdout.json
          python backend/tests/realistic_ocr_documents.py --suite samples --output work/camera-samples.json
      - name: Saved blank form regression
        run: >-
          python backend/tests/sample_corpus.py evaluate
          --suites originals --cases 작품요약서.png
          --profiles clean desk tilted dark_screen --require-correct
          --output work/camera-saved-form.json
      - name: Saved everyday scenes and unreadable negatives
        run: >-
          python backend/tests/sample_corpus.py evaluate
          --suites everyday_text
          --cases g_labor g_loan g_notice g_consent g_application g_summary g_receipt
          --profiles distant_desk sideways_desk body_glare tiny_unreadable --require-correct
          --output work/camera-saved-scenes.json
      - name: Original photo coordinates after crop and rotation
        run: python backend/tests/check_sample_geometry.py work/camera-saved-scenes.json
      - name: Save OCR diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-evaluation
          path: work/camera-*.json
          if-no-files-found: ignore
