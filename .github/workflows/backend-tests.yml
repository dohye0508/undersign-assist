name: Backend regression tests

on:
  push:
    paths: ["backend/**", "app/test/fixtures/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", "app/test/fixtures/**", ".github/workflows/backend-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/tests -p "test_*.py" -v
      - run: python backend/tests/smoke_judge.py
